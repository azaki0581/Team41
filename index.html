<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════════
   냉장고 털기 — 도전학기 팀프로젝트
   냉장고에 있는 재료를 입력하면 만들 수 있는 요리를 추천하는 웹 서비스

   이 파일 하나가 앱 전체입니다. 빌드 도구도, 서버도 필요 없습니다.
   더블클릭해서 브라우저로 열면 바로 동작합니다.

   ┌ 파일 구성 ─────────────────────────────────────────────────────┐
   │  index.html   ← 지금 이 파일 (화면 + 추천 로직)                 │
   │  recipes.js     레시피 1,151건. 자동 생성물이니 직접 고치지 마세요 │
   │  tools/         recipes.js 를 만드는 스크립트 (README 참고)      │
   └───────────────────────────────────────────────────────────────┘

   ┌ 이 파일 안의 순서 ──────────────────────────────────────────────┐
   │  <style>   디자인 토큰 → 다크모드 → 화면별 스타일               │
   │  <body>    화면 구조 (헤더 / 입력 / 로딩 / 결과 / 푸터)          │
   │  <script>  재료 입력 → 양념 선택 → 매칭 → 카드 렌더링           │
   └───────────────────────────────────────────────────────────────┘

   디자인은 당근 SEED Design System 토큰을 따릅니다. 자세한 내용은 README.md
  ═══════════════════════════════════════════════════════════════════════
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 보안: 이 페이지가 무엇을 불러올 수 있는지 브라우저에 직접 못박아 둔다.
     혹시 recipes.js 나 화면 문구에 이상한 값이 섞여 들어오더라도, 바깥으로
     데이터가 새거나 외부 스크립트가 실행되는 일은 브라우저가 막아준다.
       default-src 'none'  기본은 전부 차단하고 필요한 것만 아래에서 연다
       script/style-src    이 파일 안에 <script>·<style> 를 직접 쓰고 있어서
                           'unsafe-inline' 이 필요하다. 외부 도메인은 막힌다
       img-src             조리 사진(식약처) + 파비콘(data:) 만 허용
       connect-src 'none'  이 앱은 fetch/XHR 을 쓰지 않는다. 데이터 유출 차단
       form-action 'none'  폼 전송 없음
       base-uri 'none'     <base> 주입으로 상대경로를 가로채는 것 차단
     ※ 클릭재킹(frame-ancestors)은 <meta> 로는 적용되지 않는다.
        Vercel 배포 시 vercel.json 의 headers 로 넣어야 한다(README 7번 참고). -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: https://www.foodsafetykorea.go.kr;
  font-src 'self';
  connect-src 'none';
  form-action 'none';
  frame-src 'none';
  object-src 'none';
  base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>냉장고 털기 — 냉장고 속 재료로 만들 수 있는 요리 추천</title>
<meta name="description" content="냉장고에 있는 재료를 입력하면, 그 재료로 만들 수 있는 요리 레시피를 매칭률 순으로 추천해드려요. 레시피 출처는 식품의약품안전처 조리식품 레시피 DB입니다.">
<meta property="og:title" content="냉장고 털기">
<meta property="og:description" content="냉장고 속 재료를 입력하면, 만들 수 있는 요리를 추천해드려요!">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
<style>
  /* ============================================================
     SEED Design System (당근) 토큰 적용
     출처: https://getdesign.kr/services/seed-design  (Apache 2.0)
     - 팔레트/타이포/간격/라운드/그림자/모션 값은 원본 토큰 그대로 사용
     - 브랜드 자산(로고·워드마크)은 쓰지 않으며, 이 서비스의 고유 브랜딩만 사용
     ============================================================ */
  :root{
    /* --- 팔레트 (Light) --- */
    --carrot-100:#fff2ec; --carrot-200:#ffe8db; --carrot-300:#ffd5c0;
    --carrot-400:#ffb999; --carrot-500:#ff9364; --carrot-600:#ff6600;
    --carrot-700:#e14d00; --carrot-800:#b93901; --carrot-900:#862b00;

    --gray-00:#ffffff;  --gray-100:#f7f8f9; --gray-200:#f3f4f5; --gray-300:#eeeff1;
    --gray-400:#dcdee3; --gray-500:#d1d3d8; --gray-600:#b0b3ba; --gray-700:#868b94;
    --gray-800:#555d6d; --gray-900:#2a3038; --gray-1000:#1a1c20;

    --green-100:#edfaf6; --green-300:#b9e9d2; --green-700:#079171; --green-900:#075445;

    /* --- 역할 토큰 ---
       글자에는 900 단계, 면을 채우는 데는 600/700 단계를 쓴다.
       팔레트가 뒤집히는 구조라 이 참조 하나로 라이트·다크 양쪽 모두
       APCA Lc 75 이상을 만족한다(라이트 89/85, 다크 80/78). */
    --bg-brand-solid:var(--carrot-600);
    --bg-brand-weak:var(--carrot-100);
    --fg-brand:var(--carrot-900);
    --fg-brand-strong:var(--carrot-900);
    --stroke-brand-weak:var(--carrot-300);

    --bg-positive-weak:var(--green-100);
    --fg-positive:var(--green-900);
    --fill-positive:var(--green-700);
    --stroke-positive-weak:var(--green-300);

    /* 기획서의 '따뜻한 크림' 요구에 맞춰 basement 를 carrot-100 으로 둔다 */
    --bg-basement:var(--carrot-100);
    --bg-default:var(--gray-00);
    --bg-fill:var(--gray-100);

    --fg-neutral:var(--gray-1000);
    --fg-neutral-muted:var(--gray-800);
    /* 보조 글자도 gray-800 을 쓴다. gray-700 은 본문 대비가 Lc 75 에 못 미친다. */
    --fg-neutral-subtle:var(--gray-800);
    --fg-placeholder:var(--gray-600);   /* 입력창 placeholder 전용 */
    --fg-neutral-inverted:var(--gray-00);

    /* SEED static-* : 테마가 바뀌어도 값이 그대로인 토큰.
       브랜드색 위에 얹는 글자처럼 뒤집히면 안 되는 곳에 쓴다. */
    --static-white:#ffffff;
    --static-black:#000000;

    --stroke-weak:var(--gray-300);
    --stroke-neutral:var(--gray-400);

    /* --- 라운드 --- */
    --r1:4px; --r2:8px; --r3:12px; --r4:16px; --r5:20px; --r6:24px; --r-full:9999px;

    /* --- 그림자 (SEED: 주목이 필요한 요소에만) --- */
    --s1:0px 1px 4px 0px rgba(0,0,0,0.078);
    --s2:0px 2px 10px 0px rgba(0,0,0,0.102);
    --s3:0px 4px 16px 0px rgba(0,0,0,0.122);

    /* --- 모션 --- */
    --d1:50ms; --d2:100ms; --d3:150ms; --d4:200ms; --d5:250ms; --d6:300ms;
    --ease:cubic-bezier(0.35,0,0.35,1);
    --ease-enter:cubic-bezier(0,0,0.15,1);
    --ease-exit:cubic-bezier(0.35,0,1,1);
    --ease-enter-expressive:cubic-bezier(0.03,0.4,0.1,1);

    /* --- 간격 (4px 기반) --- */
    --x1:4px; --x2:8px; --x3:12px; --x4:16px; --x5:20px; --x6:24px; --x8:32px; --x10:40px;

    color-scheme:light dark;
  }

  /* ============================================================
     Dark Mode
     SEED 원칙: "팔레트가 뒤집히고 역할 토큰 참조는 그대로 유지된다"
     → 팔레트 변수만 dark 값으로 재정의하면 역할 토큰이 알아서 따라간다.
       (예외: 브랜드는 라이트 carrot-600 → 다크 carrot-700 으로 한 단계 이동)
     ============================================================ */
  @media (prefers-color-scheme:dark){
    :root{
      --carrot-100:#31241f; --carrot-200:#4b291c; --carrot-300:#6b311c;
      --carrot-400:#923600; --carrot-500:#bd4201; --carrot-600:#e65200;
      --carrot-700:#ff6600; --carrot-800:#ff9e65; --carrot-900:#eecebc;

      --gray-00:#000000;  --gray-100:#16171b; --gray-200:#1d2025; --gray-300:#2b2e35;
      --gray-400:#393d46; --gray-500:#5b606a; --gray-600:#868b94; --gray-700:#b0b3ba;
      --gray-800:#dcdee3; --gray-900:#e9eaec; --gray-1000:#f3f4f5;

      --green-100:#202926; --green-300:#20493b; --green-700:#22b27f; --green-900:#93e5c0;

      /* 팔레트만 뒤집으면 fg-brand / fg-positive 는 자동으로 밝은 쪽을 가리킨다.
         단계 이동이 필요한 건 브랜드 솔리드 하나뿐 (carrot-600 → 700). */
      --bg-brand-solid:var(--carrot-700);

      /* 면 레이어: basement(가장 아래) → default(카드) → fill(안쪽) */
      --bg-basement:var(--gray-00);
      --bg-default:var(--gray-100);
      --bg-fill:var(--gray-200);
    }
    /* 다크에서는 사진이 너무 튀지 않게 살짝 눌러준다 */
    .thumb, .step-img{filter:brightness(.92);}
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg-basement);
    color:var(--fg-neutral);
    /* SEED font-sans 토큰 원문 그대로.
       "별도 브랜드 서체 없음 — 여러 국가·문화·OS에서 일관된 경험과 가독성을 위해 기기 시스템 폰트 사용" */
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,
                "Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji",
                "Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";
    font-size:16px; line-height:22px;           /* t5 */
    letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  button{font:inherit;color:inherit;cursor:pointer;}
  input{font:inherit;color:inherit;}
  h1,h2,h3,h4{margin:0;letter-spacing:-.025em;}
  ul,ol{margin:0;padding:0;}
  img{max-width:100%;display:block;}

  /* SEED 반응형 — base 0–479 / sm 480–767 : 거터 16px, 여백 12px
                    md 768–1279 / lg 1280–1439 / xl 1440+ : 거터 32px, 여백 24px
     본문 최대 폭은 SEED 표준 1040px 대신 812px 을 쓴다.
     한 줄짜리 단일 컬럼 목록이라 1040px 은 읽기에 너무 넓다. (의도적 예외) */
  .wrap{width:100%;max-width:812px;margin:0 auto;padding:0 var(--x4);}
  @media (min-width:768px){ .wrap{padding:0 var(--x8);} }

  /* ---------------- 헤더 ---------------- */
  header{padding:var(--x10) 0 var(--x6);text-align:center;}
  .logo{
    display:inline-flex;align-items:center;gap:var(--x2);
    background:var(--bg-default);border:1px solid var(--stroke-weak);
    padding:6px var(--x3) 6px var(--x2);border-radius:var(--r-full);
    font-size:13px;line-height:18px;font-weight:500;   /* t3 */
    color:var(--fg-neutral-subtle);margin-bottom:var(--x4);
  }
  h1{font-size:40px;line-height:52px;font-weight:700;}   /* t13 */
  .subtitle{
    margin:var(--x2) auto 0;max-width:430px;
    color:var(--fg-neutral-muted);font-size:16px;line-height:22px;   /* t5 */
  }

  .source-bar{
    display:inline-flex;align-items:center;gap:var(--x2);justify-content:center;
    margin:var(--x4) auto 0;padding:var(--x2) var(--x4);
    background:var(--bg-default);border:1px solid var(--stroke-weak);
    border-radius:var(--r-full);color:var(--fg-neutral-muted);
    font-size:13px;line-height:18px;font-weight:500;   /* t3 */
  }
  .source-bar b{color:var(--fg-brand);font-weight:700;}
  .source-bar.warn{background:var(--bg-brand-weak);border-color:var(--stroke-brand-weak);color:var(--carrot-800);}

  main{flex:1 0 auto;padding-bottom:var(--x10);}

  /* SEED: 깊이는 면(surface)으로 표현하고 그림자는 아낀다 */
  .card{
    background:var(--bg-default);
    border:1px solid var(--stroke-weak);
    border-radius:var(--r6);
  }
  .panel{padding:var(--x6) var(--x5);}

  .label{
    display:block;font-size:13px;line-height:18px;font-weight:700;   /* t3 */
    color:var(--fg-neutral-muted);margin-bottom:var(--x2);
  }
  .label .hint{font-weight:400;color:var(--fg-placeholder);margin-left:var(--x2);}

  /* ---------------- 입력 ---------------- */
  .input-row{display:flex;gap:var(--x2);}
  .input-row input{
    flex:1;min-width:0;padding:14px var(--x4);
    background:var(--bg-default);
    border:1px solid var(--stroke-neutral);
    border-radius:var(--r3);outline:none;
    transition:border-color var(--d2) var(--ease), box-shadow var(--d2) var(--ease);
  }
  .input-row input::placeholder{color:var(--fg-placeholder);}
  .input-row input:focus{
    border-color:var(--bg-brand-solid);
    box-shadow:0 0 0 3px var(--carrot-200);
  }
  .btn-add{
    flex:0 0 auto;padding:0 var(--x5);
    background:var(--bg-fill);border:1px solid var(--stroke-neutral);
    border-radius:var(--r3);color:var(--fg-neutral-muted);font-weight:700;
    transition:background var(--d2) var(--ease), transform var(--d1) var(--ease);
  }
  .btn-add:hover{background:var(--gray-200);}
  .btn-add:active{transform:scale(.98);}   /* SEED scale-s98 */

  /* Chip: Container + Label + Suffix */
  .chips{display:flex;flex-wrap:wrap;gap:var(--x2);margin-top:var(--x3);}
  .chips:empty{margin-top:0;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 6px 6px var(--x3);
    background:var(--bg-brand-weak);
    border:1px solid var(--stroke-brand-weak);
    border-radius:var(--r-full);
    font-size:14px;line-height:19px;font-weight:500;   /* t4 */
    color:var(--fg-brand-strong);
    animation:pop var(--d3) var(--ease-enter-expressive);
  }
  .chip button{
    display:grid;place-items:center;width:18px;height:18px;padding:0;
    background:var(--carrot-200);border:0;border-radius:var(--r-full);
    color:var(--carrot-800);font-size:12px;line-height:1;
    transition:background var(--d2) var(--ease);
  }
  .chip button:hover{background:var(--carrot-300);}
  @keyframes pop{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}

  .empty-chips{
    margin-top:var(--x3);padding:14px var(--x4);
    background:var(--bg-fill);border-radius:var(--r3);
    color:var(--fg-neutral-subtle);font-size:14px;line-height:19px;text-align:center;
  }

  /* 재료 자동완성 드롭다운 — input-wrap 을 기준으로 바로 아래에 뜬다 */
  .input-wrap{position:relative;}
  .suggest-list{
    display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;
    max-height:260px;overflow-y:auto;list-style:none;
    background:var(--bg-default);border:1px solid var(--stroke-neutral);
    border-radius:var(--r3);box-shadow:var(--s3);
  }
  .suggest-list.on{display:block;}
  .suggest-item{
    display:flex;align-items:center;justify-content:space-between;gap:var(--x2);
    padding:11px var(--x4);font-size:14px;line-height:19px;cursor:pointer;
  }
  .suggest-item:hover, .suggest-item[aria-selected="true"]{background:var(--bg-fill);}
  .suggest-item .cnt{
    flex:0 0 auto;color:var(--fg-neutral-subtle);font-size:12px;
    font-variant-numeric:tabular-nums;
  }

  /* Filter Bar 형태의 빠른 선택 */
  .quick{margin-top:var(--x6);padding-top:var(--x5);border-top:1px solid var(--stroke-weak);}
  .quick-list{display:flex;flex-wrap:wrap;gap:var(--x2);}
  .quick-btn{
    padding:8px 14px;background:var(--bg-default);
    border:1px solid var(--stroke-neutral);border-radius:var(--r-full);
    font-size:14px;line-height:19px;font-weight:500;color:var(--fg-neutral-muted);
    transition:all var(--d2) var(--ease);
  }
  .quick-btn:hover{border-color:var(--gray-600);color:var(--fg-neutral);}
  .quick-btn:active{transform:scale(.98);}
  .quick-btn[data-on="1"]{
    background:var(--gray-900);border-color:var(--gray-900);color:var(--fg-neutral-inverted);font-weight:700;
  }
  .quick-btn[data-on="1"]::before{content:"✓ ";}

  /* 양념은 기본으로 켜져 있고 '끄는' 조작이라, 주재료보다 한 톤 낮게 둔다 */
  .pantry-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--x2);}
  .link-btn{
    padding:0;background:none;border:0;
    color:var(--fg-neutral-subtle);font-size:13px;line-height:18px;font-weight:700;
    text-decoration:underline;text-underline-offset:3px;
  }
  .link-btn:hover{color:var(--fg-brand);}
  .pantry .quick-btn{
    background:var(--bg-fill);border-color:transparent;color:var(--fg-neutral-subtle);
    text-decoration:line-through;text-decoration-color:var(--gray-600);
  }
  .pantry .quick-btn[data-on="1"]{
    background:var(--bg-default);border-color:var(--stroke-neutral);
    color:var(--fg-neutral-muted);font-weight:500;text-decoration:none;
  }
  .pantry .quick-btn[data-on="1"]::before{content:"✓ ";color:var(--fg-positive);font-weight:700;}
  .pantry .quick-btn::before{content:"";}

  /* CTA — SEED 규격: bg-brand-solid + rounded.full. 글자는 테마 무관 static-white */
  .cta{
    display:block;width:100%;margin-top:var(--x6);padding:17px;
    background:var(--bg-brand-solid);border:0;border-radius:var(--r-full);
    color:var(--static-white);   /* 다크에서 뒤집히면 안 되므로 static 토큰 */
    font-size:17px;line-height:23px;font-weight:700;letter-spacing:-.02em;
    transition:background var(--d2) var(--ease), transform var(--d1) var(--ease);
  }
  .cta:hover{background:var(--carrot-700);}
  .cta:active{transform:scale(.98);}
  .cta:disabled{background:var(--gray-300);color:var(--gray-600);cursor:not-allowed;transform:none;}

  /* ---------------- 로딩 ---------------- */
  #loading{display:none;padding:var(--x10) var(--x6);text-align:center;}
  #loading.on{display:block;animation:fade var(--d4) var(--ease-enter);}
  .pan{font-size:40px;display:inline-block;animation:shake 1s var(--ease) infinite;}
  @keyframes shake{0%,100%{transform:rotate(-9deg);}50%{transform:rotate(9deg) translateY(-6px);}}
  .tip{margin-top:var(--x3);color:var(--fg-neutral-muted);font-size:15px;line-height:21px;}
  .tip b{color:var(--fg-brand);font-weight:700;}

  /* ---------------- 결과 ---------------- */
  #results{display:none;} #results.on{display:block;}
  .result-head{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:var(--x3);flex-wrap:wrap;margin:var(--x8) 0 var(--x4);
  }
  .result-head h2{font-size:22px;line-height:30px;font-weight:700;}   /* t8 */
  .result-head h2 em{font-style:normal;color:var(--fg-brand);}
  .elapsed{font-size:13px;line-height:18px;color:var(--fg-neutral-subtle);font-variant-numeric:tabular-nums;}
  .assume{
    margin:calc(var(--x3) * -1) 0 var(--x4);
    font-size:13px;line-height:18px;color:var(--fg-neutral-subtle);
  }

  .recipe-list{display:flex;flex-direction:column;gap:var(--x3);list-style:none;}
  .recipe{
    background:var(--bg-default);border:1px solid var(--stroke-weak);
    border-radius:var(--r5);overflow:hidden;
    opacity:0;transform:translateY(10px);
    animation:rise var(--d6) var(--ease-enter) forwards;
    transition:border-color var(--d2) var(--ease), box-shadow var(--d2) var(--ease);
  }
  .recipe:hover{border-color:var(--stroke-neutral);box-shadow:var(--s2);}
  @keyframes rise{to{opacity:1;transform:translateY(0);}}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}

  .recipe-top{
    display:flex;gap:var(--x4);width:100%;padding:var(--x4);
    background:none;border:0;text-align:left;align-items:flex-start;
  }
  .thumb{
    flex:0 0 84px;width:84px;height:84px;border-radius:var(--r3);
    background:var(--bg-fill);object-fit:cover;
  }
  .thumb.ph{display:grid;place-items:center;font-size:28px;}
  .r-body{flex:1;min-width:0;}
  .r-line1{display:flex;align-items:center;gap:var(--x2);flex-wrap:wrap;}
  .r-name{font-size:20px;line-height:27px;font-weight:700;letter-spacing:-.025em;}   /* t7 */
  .r-cat{
    padding:2px var(--x2);border-radius:var(--r1);
    background:var(--bg-fill);color:var(--fg-neutral-subtle);
    font-size:12px;line-height:16px;font-weight:500;   /* t2 */
  }
  /* Badge — SEED: 브랜드색은 꼭 필요한 곳에만 */
  .r-match{
    margin-left:auto;display:inline-flex;align-items:center;
    padding:4px 10px;border-radius:var(--r-full);
    font-size:13px;line-height:18px;font-weight:700;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .r-match.ready  {background:var(--bg-positive-weak);color:var(--fg-positive);}
  .r-match.close  {background:var(--bg-brand-weak);   color:var(--fg-brand-strong);}
  .r-match.partial{background:var(--bg-fill);         color:var(--fg-neutral-muted);}

  .bar{height:4px;margin-top:var(--x3);background:var(--gray-300);border-radius:var(--r-full);overflow:hidden;}
  .bar i{
    display:block;height:100%;border-radius:var(--r-full);
    background:var(--fill-positive);width:0;
    transition:width var(--d6) var(--ease);
  }
  .bar i.close, .bar i.partial{background:var(--bg-brand-solid);}

  .r-meta{display:flex;gap:var(--x2);flex-wrap:wrap;margin-top:var(--x3);}
  .metric{
    display:inline-flex;align-items:center;gap:5px;padding:4px 10px;
    background:var(--bg-fill);border-radius:var(--r-full);
    font-size:13px;line-height:18px;color:var(--fg-neutral-muted);font-weight:500;
  }

  .r-ing{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--x3);}
  .tag{
    padding:4px 10px;border-radius:var(--r-full);
    font-size:13px;line-height:18px;font-weight:500;border:1px solid transparent;
  }
  .tag.have{background:var(--bg-positive-weak);color:var(--fg-positive);border-color:var(--stroke-positive-weak);}
  .tag.need{background:var(--bg-default);color:var(--fg-neutral-subtle);border-color:var(--stroke-neutral);}

  .miss-note{
    margin-top:var(--x3);padding:10px var(--x3);border-radius:var(--r2);
    background:var(--bg-brand-weak);color:var(--fg-brand-strong);font-size:13px;line-height:18px;
  }
  .miss-note b{font-weight:700;}

  /* 대체 재료 제안 — 부족한 재료 중, 내가 이미 가진 걸로 바꿀 수 있는 게 있을 때만 뜬다 */
  .sub-note{
    margin-top:var(--x2);padding:10px var(--x3);border-radius:var(--r2);
    background:var(--bg-fill);color:var(--fg-neutral-muted);font-size:13px;line-height:18px;
  }
  .sub-note b{color:var(--fg-neutral);font-weight:700;}

  /* 장보기 리스트에 담기 — .recipe-top(버튼) 안에 들어가므로 실제 <button> 이 아니라
     버튼처럼 보이는 span 이다 (버튼 안에 버튼을 중첩할 수 없어서) */
  .shop-add-btn{
    display:flex;width:fit-content;align-items:center;gap:5px;margin-top:var(--x2);
    padding:8px 12px;background:var(--bg-fill);
    border:1px solid var(--stroke-neutral);border-radius:var(--r-full);
    font-size:13px;font-weight:700;color:var(--fg-neutral-muted);
    transition:all var(--d2) var(--ease);
  }
  .shop-add-btn:hover{border-color:var(--gray-600);color:var(--fg-neutral);}
  .shop-add-btn:active{transform:scale(.98);}
  .shop-add-btn[aria-disabled="true"]{color:var(--fg-positive);border-color:var(--stroke-positive-weak);background:var(--bg-positive-weak);}

  .r-toggle{
    display:inline-flex;align-items:center;gap:var(--x1);margin-top:var(--x3);
    color:var(--fg-brand);font-size:14px;line-height:19px;font-weight:700;
  }
  .r-toggle .arrow{transition:transform var(--d3) var(--ease);display:inline-block;}
  .recipe[data-open="1"] .r-toggle .arrow{transform:rotate(180deg);}

  /* ---------------- 상세 ---------------- */
  .r-detail{display:none;padding:0 var(--x4) var(--x5);border-top:1px solid var(--stroke-weak);}
  .recipe[data-open="1"] .r-detail{display:block;animation:fade var(--d4) var(--ease-enter);}
  .sec-title{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--x2);
    margin:var(--x5) 0 var(--x3);
    font-size:14px;line-height:19px;font-weight:700;color:var(--fg-neutral);
  }
  .sec-title .sub{font-weight:400;color:var(--fg-neutral-subtle);margin-left:var(--x2);font-size:13px;}

  /* 인분 변환 토글 (1인분/2인분) */
  .serve-toggle{display:inline-flex;border:1px solid var(--stroke-neutral);border-radius:var(--r-full);overflow:hidden;}
  .serve-btn{padding:5px 12px;font-size:12px;font-weight:700;color:var(--fg-neutral-subtle);background:var(--bg-default);}
  .serve-btn.on{background:var(--gray-900);color:var(--fg-neutral-inverted);}
  .serve-note{margin-top:var(--x2);font-size:12px;line-height:17px;color:var(--fg-neutral-subtle);}

  .ing-table{display:flex;flex-direction:column;gap:var(--x1);list-style:none;}
  .ing-row{
    display:flex;justify-content:space-between;gap:var(--x3);align-items:baseline;
    padding:10px var(--x3);border-radius:var(--r2);
    background:var(--bg-fill);font-size:15px;line-height:21px;
  }
  .ing-row.have{background:var(--bg-positive-weak);}
  .ing-row .nm{font-weight:500;}
  .ing-row.have .nm{color:var(--fg-positive);font-weight:700;}
  .ing-row .amt{
    color:var(--fg-neutral-subtle);font-size:13px;line-height:18px;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .ing-group{margin-top:var(--x4);margin-bottom:var(--x2);font-size:13px;font-weight:700;color:var(--fg-neutral-subtle);}

  .steps{list-style:none;display:flex;flex-direction:column;gap:var(--x4);}
  .step{display:flex;gap:var(--x3);}
  .step-no{
    flex:0 0 22px;width:22px;height:22px;display:grid;place-items:center;
    background:var(--gray-900);color:var(--fg-neutral-inverted);border-radius:var(--r-full);
    font-size:12px;line-height:16px;font-weight:700;margin-top:2px;
  }
  .step-body{flex:1;min-width:0;}
  .step-text{font-size:16px;line-height:24px;}
  .step-img{margin-top:var(--x2);border-radius:var(--r3);max-width:260px;}

  .nutri{display:flex;gap:6px;flex-wrap:wrap;}
  .nutri span{
    padding:6px var(--x3);border-radius:var(--r2);background:var(--bg-fill);
    font-size:13px;line-height:18px;color:var(--fg-neutral-muted);font-weight:500;
  }
  .tipbox{
    margin-top:var(--x4);padding:var(--x3) var(--x4);border-radius:var(--r3);
    background:var(--bg-positive-weak);color:var(--fg-positive);
    font-size:14px;line-height:20px;
  }

  /* 내 평가 (별점) — 이 브라우저에만 저장되는 개인 기록. r-detail 안쪽이라
     진짜 <button> 을 써도 된다 (상위가 버튼이 아니라 div 라서 중첩 문제 없음) */
  .rating{display:flex;gap:2px;}
  .star{
    background:none;border:0;padding:2px;font-size:24px;line-height:1;
    color:var(--gray-500);transition:color var(--d2) var(--ease);
  }
  .star.on{color:var(--carrot-600);}
  .star:hover{color:var(--carrot-500);}

  /* ---------------- 액션 ---------------- */
  .actions{display:flex;gap:var(--x2);margin-top:var(--x5);flex-wrap:wrap;}
  .btn-ghost{
    flex:1 1 200px;padding:15px;background:var(--bg-default);
    border:1px solid var(--stroke-neutral);border-radius:var(--r-full);
    font-weight:700;color:var(--fg-neutral);
    transition:all var(--d2) var(--ease);
  }
  .btn-ghost:hover{border-color:var(--gray-600);}
  .btn-ghost:active{transform:scale(.98);}
  .btn-ghost:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn-ghost.primary{background:var(--bg-brand-weak);border-color:var(--stroke-brand-weak);color:var(--carrot-800);}
  .btn-ghost.primary:hover{background:var(--carrot-200);}

  .no-result{
    text-align:center;padding:var(--x10) var(--x6);background:var(--bg-default);
    border:1px solid var(--stroke-weak);border-radius:var(--r6);
    animation:fade var(--d4) var(--ease-enter);
  }
  .no-result .emoji{font-size:36px;}
  .no-result h3{margin-top:var(--x3);font-size:20px;line-height:27px;font-weight:700;}
  .no-result p{margin:var(--x2) auto 0;max-width:360px;color:var(--fg-neutral-muted);font-size:15px;line-height:21px;}
  .no-result code{
    background:var(--bg-fill);padding:2px 6px;border-radius:var(--r1);
    font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  footer{
    flex-shrink:0;padding:var(--x6) var(--x4) var(--x10);text-align:center;
    color:var(--fg-neutral-subtle);font-size:13px;line-height:20px;
    border-top:1px solid var(--stroke-weak);
  }
  footer b{color:var(--fg-neutral-subtle);font-weight:700;}
  footer .src{display:block;margin-top:var(--x1);font-size:12px;line-height:16px;}

  /* ---------------- 장보기 리스트 ---------------- */
  .shop-fab{
    position:fixed;right:var(--x5);bottom:var(--x5);z-index:40;
    width:56px;height:56px;border-radius:var(--r-full);border:0;
    background:var(--bg-brand-solid);color:var(--static-white);
    font-size:23px;display:grid;place-items:center;box-shadow:var(--s3);
    transition:transform var(--d2) var(--ease);
  }
  .shop-fab[hidden]{display:none;}
  .shop-fab:active{transform:scale(.94);}
  .shop-badge{
    position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;padding:0 5px;
    border-radius:var(--r-full);background:var(--carrot-900);color:var(--static-white);
    font-size:11px;font-weight:700;display:grid;place-items:center;
    border:2px solid var(--bg-basement);font-variant-numeric:tabular-nums;
  }
  .shop-panel{
    position:fixed;right:var(--x5);bottom:calc(56px + var(--x5) + var(--x3));z-index:40;
    width:min(320px, calc(100vw - 40px));
    max-height:min(60vh, 480px);display:flex;flex-direction:column;
    background:var(--bg-default);border:1px solid var(--stroke-weak);border-radius:var(--r5);
    box-shadow:var(--s3);padding:var(--x5);
    opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;
    transition:opacity var(--d3) var(--ease), transform var(--d3) var(--ease);
  }
  .shop-panel.on{opacity:1;transform:none;pointer-events:auto;}
  .shop-head{
    display:flex;align-items:center;justify-content:space-between;
    font-size:15px;font-weight:700;margin-bottom:var(--x3);flex:0 0 auto;
  }
  .shop-empty{
    margin:0;color:var(--fg-neutral-subtle);font-size:13px;line-height:19px;
    text-align:center;padding:var(--x4) 0;
  }
  .shop-items{
    list-style:none;display:flex;flex-direction:column;gap:6px;
    overflow-y:auto;margin:0 0 var(--x3);
  }
  .shop-items:empty{margin:0;}
  .shop-row{
    display:flex;align-items:center;justify-content:space-between;gap:var(--x2);
    padding:9px 10px;background:var(--bg-fill);border-radius:var(--r2);font-size:14px;
  }
  .shop-row-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
  .shop-buy{
    flex:0 0 auto;padding:5px 10px;border-radius:var(--r-full);
    background:var(--bg-brand-weak);color:var(--fg-brand-strong);
    font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap;
  }
  .shop-buy:hover{background:var(--carrot-200);}
  .shop-row button{background:none;border:0;color:var(--fg-neutral-subtle);font-size:16px;line-height:1;padding:2px;}
  .shop-row button:hover{color:var(--fg-brand);}
  .shop-note{
    margin:0 0 var(--x3);font-size:12px;line-height:17px;color:var(--fg-neutral-subtle);
  }
  .shop-actions{display:flex;gap:var(--x2);flex:0 0 auto;}
  .shop-actions .btn-ghost{flex:1;padding:11px;font-size:13px;}

  @media (max-width:479px){
    .shop-fab{right:var(--x4);bottom:var(--x4);}
    .shop-panel{right:var(--x4);left:var(--x4);width:auto;}
  }

  /* ---------------- 반응형 (SEED base 0–479) ---------------- */
  @media (max-width:479px){
    header{padding:var(--x8) 0 var(--x5);}
    h1{font-size:28px;line-height:38px;}          /* t11 */
    .subtitle{font-size:15px;line-height:21px;}
    .panel{padding:var(--x5) var(--x4);}
    .recipe-top{padding:var(--x3);gap:var(--x3);}
    .thumb{flex-basis:64px;width:64px;height:64px;}
    .r-detail{padding:0 var(--x3) var(--x4);}
    .r-name{font-size:18px;line-height:24px;}     /* t6 */
    .r-match{margin-left:0;}
    .result-head h2{font-size:20px;line-height:27px;}
    .source-bar{font-size:12px;line-height:16px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
    .recipe{opacity:1;transform:none;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo"><span>🧊</span><span>도전학기 팀프로젝트</span></div>
    <h1>냉장고 털기</h1>
    <p class="subtitle">냉장고 속 재료를 입력하면, 만들 수 있는 요리를 추천해드려요!</p>
    <div class="source-bar" id="sourceBar"></div>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="card panel" aria-labelledby="inputLabel">
      <label class="label" id="inputLabel" for="ingredientInput">
        지금 가지고 있는 재료<span class="hint">엔터 또는 추가 버튼</span>
      </label>
      <div class="input-wrap">
        <div class="input-row">
          <input id="ingredientInput" type="text" placeholder="예: 계란, 김치, 밥" autocomplete="off" enterkeyhint="done">
          <button class="btn-add" id="addBtn" type="button">추가</button>
        </div>
        <ul class="suggest-list" id="suggestList" role="listbox" aria-label="재료 자동완성"></ul>
      </div>

      <div class="chips" id="chips" role="list" aria-label="추가한 재료"></div>
      <p class="empty-chips" id="emptyChips">아직 추가한 재료가 없어요. 아래 버튼으로 빠르게 담아보세요 👇</p>

      <div class="quick">
        <span class="label">자주 쓰는 재료</span>
        <div class="quick-list" id="quickList"></div>
      </div>

      <div class="quick pantry">
        <div class="pantry-head">
          <span class="label">
            양념 · 조미료<span class="hint">집에 없는 건 눌러서 꺼주세요</span>
          </span>
          <button class="link-btn" id="pantryToggle" type="button">모두 끄기</button>
        </div>
        <div class="quick-list" id="pantryList"></div>
      </div>

      <div class="quick">
        <span class="label">
          요리 종류<span class="hint">고르지 않으면 전체에서 찾아요</span>
        </span>
        <div class="quick-list" id="catList"></div>
      </div>

      <button class="cta" id="searchBtn" type="button" disabled>레시피 추천받기</button>
    </section>

    <section id="loading" aria-live="polite">
      <div class="pan">🍳</div>
      <p class="tip" id="tipText"></p>
    </section>

    <section id="results" aria-live="polite"></section>
  </div>
</main>

<footer>
  냉장고 털기 <b>|</b> 도전학기 팀프로젝트
  <span class="src" id="footSrc"></span>
</footer>

<!-- 장보기 리스트 — 담긴 재료가 있을 때만 떠 있는 버튼으로 나타난다 -->
<button class="shop-fab" id="shopFab" type="button" aria-label="장보기 리스트 열기" hidden>
  🛒<span class="shop-badge" id="shopBadge"></span>
</button>
<div class="shop-panel" id="shopPanel">
  <div class="shop-head">
    <span>🛒 장보기 리스트</span>
    <button class="link-btn" id="shopClose" type="button">닫기</button>
  </div>
  <p class="shop-empty" id="shopEmpty">담긴 재료가 없어요. 레시피 카드에서 부족한 재료를 담아보세요.</p>
  <ul class="shop-items" id="shopItems"></ul>
  <p class="shop-note" id="shopNote">쿠팡 링크는 재료명으로 검색한 결과로 연결돼요. (제휴 링크 아님)</p>
  <div class="shop-actions">
    <button class="btn-ghost" id="shopCopy" type="button">목록 복사하기</button>
    <button class="btn-ghost" id="shopClear" type="button">모두 비우기</button>
  </div>
</div>

<script src="recipes.js"></script>
<script>
(function () {
  "use strict";

  /* ═══════════════════════════════════════════════════════════
       추천 로직

       1. 사용자가 가진 재료를 모은다
          - myIngredients : 직접 입력하거나 '자주 쓰는 재료'에서 고른 것
          - myPantry      : '양념·조미료'에서 켜둔 것 (브라우저에 저장됨)
       2. 레시피마다 필요한 재료를 하나씩 대조한다  → matchRecipe()
       3. 사야 할 게 적고, 내 재료를 많이 쓰는 순으로 정렬한다  → search()
       4. 카드로 그린다  → recipeCard()

       숫자를 조정하고 싶다면 아래 상수를 보세요.
         MAX_NEED   결과에 넣을 최대 '사야 할 재료' 수
         PAGE_SIZE  한 번에 보여줄 카드 수
     ═══════════════════════════════════════════════════════════ */

  var DB = window.RECIPE_DB;

  // 빠른 추가용 식재료. 데이터에서 자주 쓰이는 순.
  // 양념·조미료는 아래 PANTRY(DB.seasonings) 칸에서 따로 고른다.
  var QUICK = ["계란","양파","대파","밥","김치","두부","감자","당근",

  var KEY_PREFIX_STRIP = ["양념장", "양념", "다진", "채썬", "손질된", "손질한", "잘게", "얇게", "곱게",

  function cleanKey(raw) {
    var k = String(raw);
    var b = k.indexOf("]");
    if (b !== -1) k = k.slice(b + 1);
    else { var lb = k.indexOf("["); if (lb !== -1) k = k.slice(0, lb); }
    // "주재료>바나나", "머랭>달걀흰자" 처럼 구획명이 ">"로 붙어 들어온 경우,
    // 실제 재료는 ">" 뒤쪽이다.
    var gt = k.lastIndexOf(">");
    if (gt !== -1 && gt < k.length - 1) k = k.slice(gt + 1);
    k = k.replace(/•/g, "").replace(/[①②③④⑤⑥⑦⑧⑨⑩]+$/, "");
    var p = k.indexOf("(");
    if (p === -1) p = k.indexOf("（");
    if (p > 0) k = k.slice(0, p);
    k = k.trim();
    if (!k) return raw;

    for (var pass = 0; pass < 2; pass++) {
      var hit = false;
      for (var i = 0; i < KEY_SUFFIX_STRIP.length; i++) {

        if (k.length > suf.length && k.slice(-suf.length) === suf) { k = k.slice(0, -suf.length); hit = true; break; }
      }
      if (!hit) break;
    }
    if (!k) return raw;

    if (KEY_ALIASES[k]) k = KEY_ALIASES[k];

    for (var pass2 = 0; pass2 < 2; pass2++) {
      var hit2 = false;
      for (var j = 0; j < KEY_PREFIX_STRIP.length; j++) {
        var pre = KEY_PREFIX_STRIP[j];
        if (k.indexOf(pre) === 0 && k.length - pre.length >= 2) { k = k.slice(pre.length); hit2 = true; break; }
      }
      if (!hit2) break;
      if (KEY_ALIASES[k]) k = KEY_ALIASES[k];
    }

    return k || raw;
  }

  function normalize(word) {

  function addIngredient(raw) {
    String(raw).split(/[,\s]+/).forEach(function (piece) {

  function renderPantry() {
    Array.prototype.forEach.call($pantry.children, function (btn) {
      btn.dataset.on = myPantry[btn.dataset.name] ? "1" : "0";
    });
    var onCount = Object.keys(myPantry).filter(function (k) { return myPantry[k]; }).length;
    $pantryToggle.textContent = onCount ? "모두 끄기" : "모두 켜기";
  }

  loadPantry();
  PANTRY.forEach(function (s) {
    var btn = document.createElement("button");
    btn.type = "button"; btn.className = "quick-btn";
    btn.dataset.name = s.key;
    btn.textContent = s.key;
    btn.setAttribute("aria-pressed", "false");
    btn.addEventListener("click", function () {
      myPantry[s.key] = !myPantry[s.key];
      btn.setAttribute("aria-pressed", String(!!myPantry[s.key]));
      savePantry(); renderPantry();
    });
    $pantry.appendChild(btn);
  });

  $pantryToggle.addEventListener("click", function () {
    var onCount = Object.keys(myPantry).filter(function (k) { return myPantry[k]; }).length;
    var next = onCount === 0;
    Object.keys(myPantry).forEach(function (k) { myPantry[k] = next; });
    savePantry(); renderPantry();
  });
  renderPantry();

  /* ============================================================
     요리 종류 필터
     밥 / 반찬 / 국&찌개 / 후식 중 원하는 것만 골라서 볼 수 있게 한다.
     아무것도 안 고르면(=전체) 필터를 걸지 않는다.
     ============================================================ */
  var CATS = ["전체", "밥", "반찬", "국&찌개", "후식", "일품", "기타"];
  var myCats = {};   // 선택한 카테고리만 true. 다 꺼져 있으면 '전체'
  var $catList = document.getElementById("catList");

  function activeCats() {
    return Object.keys(myCats).filter(function (k) { return myCats[k]; });
  }

  function renderCats() {
    Array.prototype.forEach.call($catList.children, function (btn) {
      var name = btn.dataset.name;
      var on = name === "전체" ? activeCats().length === 0 : !!myCats[name];
      btn.dataset.on = on ? "1" : "0";
    });
  }

  CATS.forEach(function (name) {
    var btn = document.createElement("button");
    btn.type = "button"; btn.className = "quick-btn";
    btn.dataset.name = name; btn.dataset.on = name === "전체" ? "1" : "0";
    btn.textContent = name;
    btn.addEventListener("click", function () {
      if (name === "전체") { myCats = {}; }
      else { myCats[name] = !myCats[name]; }
      renderCats();
    });
    $catList.appendChild(btn);
  });
  renderCats();

  /* ============================================================
     재료 입력 자동완성 (2차)
     레시피 1,151건에 실제로 등장하는 재료 중에서 지금 입력창에 쓰고 있는
     글자로 시작하는 것들을 자주 쓰이는 순으로 보여준다. 원본 재료 키는
     1,660종이지만, 이 시점에는 이미 cleanKey() 로 한 번 정리된 뒤라
     실제로는 992종(중복 제거분) 중에서 추천한다. */
  var $suggest = document.getElementById("suggestList");
  var ING_FREQ = {};
  DB.recipes.forEach(function (r) {
    r.ings.forEach(function (ing) {
      ING_FREQ[ing.key] = (ING_FREQ[ing.key] || 0) + 1;
    });
  });
  var ALL_ING_KEYS = Object.keys(ING_FREQ).sort(function (a, b) {
    return ING_FREQ[b] - ING_FREQ[a] || a.localeCompare(b, "ko");
  });

  var suggestItems = [], suggestIndex = -1;

  // 쉼표로 여러 개를 한 번에 입력할 수 있으니, 지금 타이핑 중인 마지막 조각만 본다
  function currentFragment() {
    var parts = $input.value.split(",");
    return parts[parts.length - 1].replace(/^\s+/, "");
  }

  function closeSuggest() {
    $suggest.classList.remove("on");
    $suggest.innerHTML = "";
    suggestItems = []; suggestIndex = -1;
  }

  function renderSuggestSelection() {
    Array.prototype.forEach.call($suggest.children, function (li, i) {
      li.setAttribute("aria-selected", i === suggestIndex ? "true" : "false");
    });
  }

  function moveSuggest(delta) {
    if (!suggestItems.length) return;
    suggestIndex = (suggestIndex + delta + suggestItems.length) % suggestItems.length;
    renderSuggestSelection();
  }

  function renderSuggest() {
    var frag = currentFragment().trim();
    if (!frag) { closeSuggest(); return; }
    var starts = [], includes = [];
    for (var i = 0; i < ALL_ING_KEYS.length && starts.length < 8; i++) {
      var k = ALL_ING_KEYS[i];
      if (myIngredients.indexOf(k) !== -1) continue;   // 이미 담은 건 뺀다
      if (k.indexOf(frag) === 0) starts.push(k);
      else if (includes.length < 8 && k.indexOf(frag) !== -1) includes.push(k);
    }
    suggestItems = starts.concat(includes).slice(0, 8);
    suggestIndex = -1;
    if (!suggestItems.length) { closeSuggest(); return; }
    $suggest.innerHTML = suggestItems.map(function (k, i) {
      return '<li class="suggest-item" role="option" data-i="' + i + '">' +
             "<span>" + escapeHtml(k) + "</span>" +
             '<span class="cnt">' + ING_FREQ[k] + "개 레시피</span></li>";
    }).join("");
    $suggest.classList.add("on");
  }

  function pickSuggest(key) {
    addIngredient(key);
    $input.value = "";
    closeSuggest();
    $input.focus();
  }

  $suggest.addEventListener("click", function (e) {
    var li = e.target.closest(".suggest-item");
    if (!li) return;
    pickSuggest(suggestItems[+li.dataset.i]);
  });
  $suggest.addEventListener("mouseover", function (e) {
    var li = e.target.closest(".suggest-item");
    if (li) { suggestIndex = +li.dataset.i; renderSuggestSelection(); }
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".input-wrap")) closeSuggest();
  });

  $input.addEventListener("input", renderSuggest);

  $addBtn.addEventListener("click", function () {
    addIngredient($input.value); $input.value = ""; $input.focus(); closeSuggest();
  });
  $input.addEventListener("keydown", function (e) {
    if ($suggest.classList.contains("on")) {
      if (e.key === "ArrowDown") { e.preventDefault(); moveSuggest(1); return; }
      if (e.key === "ArrowUp")   { e.preventDefault(); moveSuggest(-1); return; }
      if (e.key === "Escape")    { closeSuggest(); return; }
      if (e.key === "Enter" && suggestIndex !== -1) {
        e.preventDefault(); pickSuggest(suggestItems[suggestIndex]); return;
      }
    }
    if (e.key === "Enter") { e.preventDefault(); addIngredient($input.value); $input.value = ""; closeSuggest(); }
    else if (e.key === "Backspace" && $input.value === "" && myIngredients.length) {
      removeIngredient(myIngredients[myIngredients.length - 1]);
    }
  });

  /* ============================================================
     매칭 — 주재료와 양념을 구분하지 않고 함께 센다
     ============================================================ */
  var ALWAYS = {};
  (DB.alwaysHave || []).forEach(function (k) { ALWAYS[k] = true; });

  function owns(key) {
    return ALWAYS[key] === true ||
           myIngredients.indexOf(key) !== -1 ||
           myPantry[key] === true;
  }

  /* 사용자가 알고 싶은 건 "지금 이걸 만들 수 있나?" 하나다.
     주재료든 양념이든 없으면 사러 가야 하는 건 똑같으므로
     한 기준으로 세고, 매칭률에도 그대로 반영한다.

     have 에는 사용자가 직접 넣은 재료뿐 아니라 켜둔 양념 17종과 물·얼음까지
     함께 들어간다. 그래서 "have 가 많다"는 건 "이 사람 냉장고를 많이 비운다"는
     뜻이 아니다 — 양념만으로 되는 요리도 have 가 잔뜩 잡힌다.
     냉장고를 '터는' 정도는 따로 세야 해서 mine 을 나눠 둔다. */
  function matchRecipe(r) {
    var have = [], miss = [], season = [], need = [], mine = [];
    r.ings.forEach(function (ing) {
      var owned = owns(ing.key);
      if (ing.seasoning) season.push(ing);
      if (owned) {
        have.push(ing);
        // 사용자가 입력창에 직접 담은 재료. 양념 체크·물은 여기 안 들어간다
        if (myIngredients.indexOf(ing.key) !== -1) mine.push(ing);
      }
      else { miss.push(ing); need.push(ing); }
    });
    var total = r.ings.length;
    return {
      r: r, have: have, miss: miss, season: season, need: need, mine: mine,
      rate: total ? Math.round((have.length / total) * 100) : 0
    };
  }

  /* ============================================================
     대체 재료 제안 (2차)
     부족한 재료 중에, 사용자가 이미 갖고 있는 다른 재료로 바꿔 쓸 수 있는 게
     있으면 알려준다. 갖고 있지도 않은 걸 "대신 이걸 써보세요"라고 하면
     의미가 없으므로, 실제로 owns() 인 대체재만 골라서 보여준다.
     흔히 쓰이는 조합만 담았고, 맛·식감이 달라질 수 있는 건 넣지 않았다.
     ============================================================ */
  var SUBSTITUTES = {
    "돼지고기": ["닭고기", "소고기"], "소고기": ["돼지고기", "닭고기"], "닭고기": ["돼지고기", "소고기"],
    "두부": ["계란"], "계란": ["두부"],
    "우유": ["두유", "요거트"], "두유": ["우유"],
    "버터": ["식용유", "올리브유"], "식용유": ["올리브유", "들기름"], "올리브유": ["식용유", "들기름"],
    "참기름": ["들기름"], "들기름": ["참기름"],
    "고추장": ["된장", "쌈장"], "된장": ["고추장", "쌈장"],
    "애호박": ["호박"], "호박": ["애호박"],
    "새우": ["오징어", "조개"], "오징어": ["새우", "조개"], "굴": ["조개"],
    "설탕": ["올리고당", "꿀"], "올리고당": ["설탕", "꿀"], "꿀": ["설탕", "올리고당"],
    "베이컨": ["햄"], "햄": ["베이컨"],
    "마요네즈": ["요거트"]
  };

  function substituteSuggestions(m) {
    var found = [];
    m.need.forEach(function (ing) {
      var subs = SUBSTITUTES[ing.key] || [];
      for (var i = 0; i < subs.length; i++) {
        if (owns(subs[i])) { found.push({ need: ing.key, sub: subs[i] }); break; }
      }
    });
    return found;
  }

  function subNoteHtml(m) {
    var subs = substituteSuggestions(m);
    if (!subs.length) return "";
    var lines = subs.map(function (s) {
      return escapeHtml(s.need) + " 대신 <b>" + escapeHtml(s.sub) + "</b>";
    }).join(", ");
    return '<div class="sub-note">🔄 ' + lines + "(으)로 대체해볼 수 있어요.</div>";
  }

  /* ============================================================
     장보기 리스트 (3차)
     레시피마다 부족한 재료를 눌러 담으면, 브라우저에 저장되는 리스트에
     모인다. 여러 레시피를 훑어보면서 "오늘 뭐 사야 하지"를 한 번에
     정리할 수 있게 하려는 목적.
     ============================================================ */
  var shoppingList = {};   // { 가지:true, 깻잎:true, ... }
  var SHOP_KEY = "fridge.shopping.v1";

  function loadShopping() {
    shoppingList = readStored(SHOP_KEY, "object") || {};
  }
  function saveShopping() {
    try { localStorage.setItem(SHOP_KEY, JSON.stringify(shoppingList)); } catch (e) { /* 사파리 시크릿 등 */ }
  }
  function shopKeys() {
    return Object.keys(shoppingList).filter(function (k) { return shoppingList[k]; });
  }

  var $shopFab   = document.getElementById("shopFab");
  var $shopBadge = document.getElementById("shopBadge");
  var $shopPanel = document.getElementById("shopPanel");
  var $shopItems = document.getElementById("shopItems");
  var $shopEmpty = document.getElementById("shopEmpty");
  var $shopNote  = document.getElementById("shopNote");
  var $shopClose = document.getElementById("shopClose");
  var $shopCopy  = document.getElementById("shopCopy");
  var $shopClear = document.getElementById("shopClear");

  // 쿠팡 "제휴 링크"가 아니라, 재료명으로 검색한 결과로 보내는 일반 검색 링크다.
  // (제휴 코드를 넣으려면 쿠팡파트너스 가입 후 본인 계정의 추적 링크로 바꿔야 한다)
  function coupangSearchUrl(name) {
    return "https://www.coupang.com/np/search?q=" + encodeURIComponent(name);
  }

  function renderShop() {
    var keys = shopKeys();
    $shopFab.hidden = keys.length === 0;
    $shopBadge.textContent = keys.length;
    $shopBadge.style.display = keys.length ? "grid" : "none";
    $shopEmpty.style.display = keys.length ? "none" : "block";
    $shopNote.style.display = keys.length ? "block" : "none";
    $shopItems.innerHTML = keys.map(function (k) {
      return '<li class="shop-row"><span>' + escapeHtml(k) + "</span>" +
        '<span class="shop-row-actions">' +
          '<a class="shop-buy" href="' + coupangSearchUrl(k) + '" target="_blank" rel="noopener noreferrer">쿠팡에서 사기</a>' +
          '<button type="button" data-k="' + escapeHtml(k) + '" aria-label="' +
          escapeHtml(k) + ' 빼기">×</button>' +
        "</span></li>";
    }).join("");
    if (!keys.length) $shopPanel.classList.remove("on");
  }

  function addToShopping(keys) {
    keys.forEach(function (k) { shoppingList[k] = true; });
    saveShopping(); renderShop();
  }

  $shopItems.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-k]");
    if (!btn) return;
    delete shoppingList[btn.dataset.k];
    saveShopping(); renderShop();
  });
  $shopFab.addEventListener("click", function () { $shopPanel.classList.toggle("on"); });
  $shopClose.addEventListener("click", function () { $shopPanel.classList.remove("on"); });
  $shopClear.addEventListener("click", function () {
    shoppingList = {}; saveShopping(); renderShop();
  });
  $shopCopy.addEventListener("click", function () {
    var text = shopKeys().join(", ");
    if (!text) return;
    var done = function () {
      $shopCopy.textContent = "복사 완료!";
      setTimeout(function () { $shopCopy.textContent = "목록 복사하기"; }, 1500);
    };
    var fail = function () {
      $shopCopy.textContent = "복사 실패 (직접 선택해주세요)";
      setTimeout(function () { $shopCopy.textContent = "목록 복사하기"; }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fail);
    } else {
      fail();
    }
  });

  loadShopping();
  renderShop();

  /* ============================================================
     내 평가 (3차)
     서버가 없어 여러 사용자의 평점을 모을 방법이 없으므로, "리뷰/평점"을
     이 브라우저 안에서만 기록되는 개인 별점으로 구현했다 — 다른 사람에게
     보이지 않는다는 걸 화면에도 그대로 밝힌다.
     ============================================================ */
  var myRatings = {};   // { 레시피id: 1~5 }
  var RATING_KEY = "fridge.ratings.v1";

  function loadRatings() {
    myRatings = readStored(RATING_KEY, "object") || {};
  }
  function saveRatings() {
    try { localStorage.setItem(RATING_KEY, JSON.stringify(myRatings)); } catch (e) { /* 사파리 시크릿 등 */ }
  }
  loadRatings();

  /* ============================================================
     인분 변환 (3차)
     계량은 "20g(5마리)"처럼 자유 텍스트라 완벽하게 환산할 수는 없다.
     문자열 안의 숫자(정수·소수·분수)만 찾아 곱해서 "대략" 맞춰준다.
     "약간"처럼 숫자가 없는 계량은 손대지 않고 그대로 둔다.
     ============================================================ */
  var VULGAR_FRACTIONS = {
    "½":0.5, "⅓":1/3, "⅔":2/3, "¼":0.25, "¾":0.75,
    "⅕":0.2, "⅖":0.4, "⅗":0.6, "⅘":0.8,
    "⅙":1/6, "⅚":5/6, "⅛":0.125, "⅜":0.375, "⅝":0.625, "⅞":0.875
  };
  var NUM_RE = /(\d+(?:\.\d+)?\/\d+(?:\.\d+)?|\d+(?:\.\d+)?|[½⅓⅔¼¾⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞])/g;

  function scaleAmount(str, mult) {
    if (!str || mult === 1) return str;
    return String(str).replace(NUM_RE, function (token) {
      var val;
      if (VULGAR_FRACTIONS.hasOwnProperty(token)) val = VULGAR_FRACTIONS[token];
      else if (token.indexOf("/") !== -1) {
        var parts = token.split("/");
        val = parseFloat(parts[0]) / parseFloat(parts[1]);
      } else {
        val = parseFloat(token);
      }
      // 소수점 1자리까지만 — 0.333... 같은 값이 화면에 나오지 않도록
      return String(Math.round(val * mult * 10) / 10);
    });
  }

  var MAX_NEED = 3;   // 사야 할 게 이보다 많으면 '만들 수 있다'고 보기 어렵다
  var readyCount = 0; // 지금 당장 만들 수 있는(살 것 0개) 요리 수
  var widened = false; // 내 재료를 쓰는 요리가 없어서 범위를 넓혔는가

  function search() {
    /* 정렬 우선순위 (위에서부터 순서대로 비교, 같으면 다음 기준으로)

       0) 지금 당장 만들 수 있는가 — 사야 할 게 0개면 무조건 먼저.
          "재료를 많이 쓰지만 뭘 더 사야 하는 메뉴"가 "지금 바로 만들 수 있는
          메뉴"를 밀어내면 안 된다.
       1) 점수 (아래 score) — 냉장고를 얼마나 비우는지가 핵심이다.
       2) 사람들이 많이 선택한 메뉴 (데이터가 쌓였을 경우)
          이 앱은 서버 없이 브라우저에서만 도는 정적 페이지라 지금은
          여러 사용자의 선택 데이터를 모을 방법이 없다. recipes.js 의
          레시피 객체에 popularity(선택 횟수 등) 값이 채워지면 이 기준이
          자동으로 살아난다. 값이 없으면 0으로 취급되어 그냥 통과한다.
       3) 사야 할 게 적은 순 → 매칭률 높은 순
       4) 조리 시간이 짧은 메뉴 — 대기시간(재우기·숙성 등)까지 더해서 비교한다.
          "9~14분" 이어도 재우는 데 2시간이 걸리면 실제로는 오래 걸리는 메뉴다.

       2026-08-17: 예전에는 0순위가 need.length 하나뿐이고 점수는 3순위
       타이브레이크로만 쓰였다. 그런데 have 에는 켜둔 양념 17종과 물이 다
       들어가서, '양념만으로 되는 요리 + 모르는 재료 1개'가 '내 재료를 3개 다
       쓰지만 2개 사야 하는 요리'를 항상 이겼다. 계란·김치·밥으로 돌리면
       상위 20개 중 내 재료를 하나라도 쓰는 게 4개(20%)뿐이었고, README 가
       "이걸 빼면 1순위로 올라온다"고 경고한 매운락교무침이 실제로 10위 안에
       있었다. 점수를 1순위로 올리고, 기준을 have 가 아니라 mine 으로 바꿨다. */
    function totalMinutes(r) { return r.time.min + (r.time.wait || 0); }

    /* 이 서비스의 목적은 냉장고를 '터는' 것이다. 그래서 가산점은 have(양념 포함)가
       아니라 mine(사용자가 직접 담은 재료)에만 준다.
       '락교·머위대'처럼 마트에서 구하기 어려운 재료가 껴 있으면 크게 감점한다. */
    function score(m) {
      var rare = m.need.filter(function (i) { return i.rare; }).length;
      return m.mine.length * 3 - m.need.length * 2 - rare * 4;
    }

    var cats = activeCats();
    var all = DB.recipes
      .filter(function (r) { return !cats.length || cats.indexOf(r.cat) !== -1; })
      .map(matchRecipe)
      .filter(function (m) { return m.rate > 0; })
      .sort(function (a, b) {
        var ready = (a.need.length === 0 ? 0 : 1) - (b.need.length === 0 ? 0 : 1);
        if (ready) return ready;

        var d = score(b) - score(a);
        if (d) return d;

        var pop = (b.r.popularity || 0) - (a.r.popularity || 0);
        if (pop) return pop;

        if (a.need.length !== b.need.length) return a.need.length - b.need.length;
        if (b.rate !== a.rate) return b.rate - a.rate;

        var t = totalMinutes(a.r) - totalMinutes(b.r);
        if (t) return t;
        return a.r.work - b.r.work;
      });

    /* 내 재료를 하나도 안 쓰는 요리는 아무리 만들기 쉬워도 '냉장고 털기'가
       아니다. 그래서 결과에서 아예 뺀다. 다만 그렇게 걸러서 남는 게 하나도
       없으면 빈 화면을 보여주느니 원래대로 넓혀서 보여준다. */
    var usesMine = all.filter(function (m) { return m.mine.length > 0; });
    var pool = usesMine.length ? usesMine : all;
    widened = usesMine.length === 0;   // 넓혔다는 사실은 화면에서 말해준다

    ranked = pool.filter(function (m) { return m.need.length <= MAX_NEED; }).slice(0, 60);
    if (!ranked.length) ranked = pool.slice(0, 12);
    readyCount = ranked.filter(function (m) { return m.need.length === 0; }).length;
    page = 0;
  }

  /* ============================================================
     카드 렌더링
     ============================================================ */
  function timeText(t) {
    var s = t.min + "~" + t.max + "분";
    if (t.wait > 0) s += " (+대기 " + t.wait + "분)";
    return s;
  }

  /* 카드의 약속은 하나뿐이다. 사야 할 게 하나라도 있으면 '다 있어요'라고 말하지 않는다. */
  function verdict(m) {
    if (m.need.length === 0)  return { cls:"ready",   text:"바로 만들 수 있어요" };
    if (m.need.length <= 2)   return { cls:"close",   text:m.need.length + "개만 더 있으면 돼요" };
    return { cls:"partial", text:"내 재료 " + m.rate + "%" };
  }

  function missNote(m) {
    var names = m.need.map(function (i) { return i.key; });
    var last = names[names.length - 1];
    var list = '<b>' + escapeHtml(names.join(", ")) + '</b>';
    return '<div class="miss-note">🛒 ' + list +
      (m.need.length <= 2
        ? "만 있으면 완성돼요."
        : josa(last, "이", "가") + " 더 필요해요.") + "</div>";
  }

  function recipeCard(m, index) {
    var r = m.r, v = verdict(m);

    var li = document.createElement("li");
    li.className = "recipe";
    li.dataset.open = "0";
    li.style.animationDelay = (index * 90) + "ms";

    var tags = m.have.map(function (i) {
      return '<span class="tag have">✓ ' + escapeHtml(i.key) + "</span>";
    }).concat(m.miss.map(function (i) {
      return '<span class="tag need">' + escapeHtml(i.key) + "</span>";
    })).join("");

    var thumb = r.img
      ? '<img class="thumb" src="' + escapeHtml(r.img) + '" alt="" loading="lazy">'
      : '<div class="thumb ph">🍽️</div>';

    // "장보기 리스트에 담기"는 .recipe-top(버튼) 안에 들어가므로 실제 <button>이
    // 아니라 버튼처럼 보이는 span 이다 — 버튼 안에 버튼을 중첩할 수 없어서다.
    var shopBtnHtml = m.need.length
      ? '<span class="shop-add-btn" role="button" tabindex="0">🛒 부족한 재료 장보기 리스트에 담기</span>'
      : "";

    li.innerHTML =
      '<button class="recipe-top" type="button" aria-expanded="false">' +
        thumb +
        '<div class="r-body">' +
          '<div class="r-line1">' +
            '<span class="r-name">' + escapeHtml(r.name) + "</span>" +
            (r.cat ? '<span class="r-cat">' + escapeHtml(r.cat) + "</span>" : "") +
            '<span class="r-match ' + v.cls + '">' + v.text + "</span>" +
          "</div>" +
          '<div class="bar"><i class="' + v.cls + '"></i></div>' +
          '<div class="r-meta">' +
            '<span class="metric">⏱ ' + timeText(r.time) + "</span>" +
            '<span class="metric">🧑‍🍳 ' + WORK_LABEL[r.work] + "</span>" +
          "</div>" +
          '<div class="r-ing">' + tags + "</div>" +
          // 부족한 재료, 대체 가능한 재료, 장보기 담기를 한 자리에 모아 보여준다.
          (m.need.length ? missNote(m) : "") +
          subNoteHtml(m) +
          shopBtnHtml +
          '<span class="r-toggle">레시피 자세히 보기 <span class="arrow">⌄</span></span>' +
        "</div>" +
      "</button>" +
      '<div class="r-detail"></div>';

    var top = li.querySelector(".recipe-top");
    top.addEventListener("click", function () {
      var open = li.dataset.open === "1";
      li.dataset.open = open ? "0" : "1";
      top.setAttribute("aria-expanded", String(!open));
      li.querySelector(".r-toggle").firstChild.nodeValue =
        open ? "레시피 자세히 보기 " : "접기 ";
    });

    var shopBtn = li.querySelector(".shop-add-btn");
    if (shopBtn) {
      var addToShop = function (e) {
        e.stopPropagation();   // 카드가 접히지 않게 (recipe-top 클릭과 분리)
        addToShopping(m.need.map(function (i) { return i.key; }));
        shopBtn.textContent = "🛒 담았어요!";
        shopBtn.setAttribute("aria-disabled", "true");
      };
      shopBtn.addEventListener("click", addToShop);
      shopBtn.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); addToShop(e); }
      });
    }

    // 상세 영역: 인분 토글 · 별점은 클릭할 때마다 다시 그려야 해서, 델리게이션으로
    // 한 번만 걸어두고 재렌더링은 renderDetail() 이 담당한다.
    var detailEl = li.querySelector(".r-detail");
    var serves = 1;
    function renderDetail() { detailEl.innerHTML = detailHtml(m, serves); }
    renderDetail();

    detailEl.addEventListener("click", function (e) {
      var serveBtn = e.target.closest(".serve-btn");
      if (serveBtn) { serves = +serveBtn.dataset.serve; renderDetail(); return; }

      var star = e.target.closest(".star");
      if (star) {
        var s = +star.dataset.star;
        myRatings[r.id] = (myRatings[r.id] || 0) === s ? 0 : s;   // 같은 별 다시 누르면 취소
        saveRatings();
        renderDetail();
      }
    });

    requestAnimationFrame(function () {
      setTimeout(function () {
        li.querySelector(".bar i").style.width = m.rate + "%";
      }, index * 90 + 60);
    });

    return li;
  }

  function detailHtml(m, serves) {
    var r = m.r;
    serves = serves || 1;
    var html = "";

    // 가진 재료는 초록 배경 + 체크, 없는 것은 기본 회색 배경으로 구분한다
    function rows(list) {
      return list.map(function (i) {
        var has = owns(i.key);
        return '<li class="ing-row' + (has ? " have" : "") + '">' +
               '<span class="nm">' + (has ? "✓ " : "") + escapeHtml(i.name) + "</span>" +
               '<span class="amt">' + escapeHtml(scaleAmount(i.amount, serves)) + "</span></li>";
      }).join("");
    }

    var mains = r.ings.filter(function (i) { return !i.seasoning; });

    /* --- 재료: 원문 계량 그대로 (인분 토글에 따라 자동 환산) --- */
    var serveToggle =
      '<span class="serve-toggle">' +
        '<button type="button" class="serve-btn' + (serves === 1 ? " on" : "") + '" data-serve="1">1인분</button>' +
        '<button type="button" class="serve-btn' + (serves === 2 ? " on" : "") + '" data-serve="2">2인분</button>' +
      "</span>";
    html += '<h4 class="sec-title"><span>재료' +
            (r.wgt ? '<span class="sub">1인분 기준 ' + escapeHtml(r.wgt) + "g</span>" : "") +
            "</span>" + serveToggle + "</h4>";
    html += '<ul class="ing-table">' + rows(mains) + "</ul>";

    if (m.season.length) {
      html += '<div class="ing-group">양념 · 고명</div>';
      html += '<ul class="ing-table">' + rows(m.season) + "</ul>";
    }

    if (serves !== 1) {
      html += '<p class="serve-note">계량은 ' + serves +
              "인분 기준으로 자동 환산한 값이에요. 실제와 소폭 다를 수 있어요.</p>";
    }

    /* --- 조리 순서: 원문 문장 + 단계별 사진 --- */
    html += '<h4 class="sec-title"><span>조리 순서<span class="sub">' + r.steps.length + "단계</span></span></h4>";
    html += '<ol class="steps">';
    r.steps.forEach(function (s, i) {
      // 시간·불세기는 이미 조리 문장 안에 들어 있으므로 따로 배지를 달지 않는다
      html += '<li class="step"><span class="step-no">' + (i + 1) + "</span>" +
              '<div class="step-body"><div class="step-text">' + escapeHtml(s.text) + "</div>" +
              (s.img ? '<img class="step-img" src="' + escapeHtml(s.img) + '" alt="" loading="lazy">' : "") +
              "</div></li>";
    });
    html += "</ol>";

    /* --- 영양정보 (인분 배수만큼 함께 곱한다) --- */
    if (r.nutri && r.nutri.kcal) {
      html += '<h4 class="sec-title"><span>영양정보<span class="sub">' + serves + "인분</span></span></h4>";
      html += '<div class="nutri">' +
        "<span>열량 " + Math.round(r.nutri.kcal * serves) + "kcal</span>" +
        "<span>탄수화물 " + Math.round(r.nutri.carb * serves) + "g</span>" +
        "<span>단백질 " + Math.round(r.nutri.pro * serves) + "g</span>" +
        "<span>지방 " + Math.round(r.nutri.fat * serves) + "g</span>" +
        "<span>나트륨 " + Math.round(r.nutri.na * serves) + "mg</span></div>";
    }

    if (r.tip) html += '<div class="tipbox">💡 ' + escapeHtml(r.tip) + "</div>";

    /* --- 내 평가: 이 브라우저에만 저장되는 개인 별점 --- */
    var myStar = myRatings[r.id] || 0;
    html += '<h4 class="sec-title"><span>내 평가<span class="sub">이 브라우저에만 저장돼요</span></span></h4>';
    html += '<div class="rating">';
    for (var s = 1; s <= 5; s++) {
      html += '<button type="button" class="star' + (myStar >= s ? " on" : "") +
              '" data-star="' + s + '" aria-label="' + s + '점">' + (myStar >= s ? "★" : "☆") + "</button>";
    }
    html += "</div>";

    return html;
  }

  /* 실제 계산 시간은 보통 1초에 한참 못 미친다. "0.0초"라고 쓰면 잰 것 같지도,
     빠른 것 같지도 않아서 1초 미만은 ms 로 그대로 보여준다. */
  function elapsedText(ms) {
    return ms < 1000 ? Math.max(1, Math.round(ms)) + "ms" : (ms / 1000).toFixed(1) + "초";
  }

  function renderResults(elapsedMs) {
    $results.innerHTML = "";
    $results.classList.add("on");

    if (!ranked.length) {
      var catHint = activeCats().length
        ? "고른 요리 종류(" + activeCats().join(", ") + ")가 너무 좁은 건 아닌지도 확인해보세요. "
        : "";
      $results.innerHTML =
        '<div class="no-result"><div class="emoji">🥲</div>' +
        "<h3>재료를 더 추가해보세요!</h3>" +
        "<p>지금 담은 재료로 만들 수 있는 요리를 찾지 못했어요. " + catHint +
        "계란, 밥, 양파 같은 기본 재료를 더해보면 결과가 확 늘어나요.</p></div>";
      return;
    }

    var slice = ranked.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);

    var head = document.createElement("div");
    head.className = "result-head";
    head.innerHTML =
      (readyCount
        ? "<h2>지금 바로 만들 수 있는 요리 <em>" + readyCount + "개</em></h2>"
        : "<h2>재료 <em>한두 개</em>만 더하면 만들 수 있어요</h2>") +
      (typeof elapsedMs === "number"
        ? '<span class="elapsed">' + elapsedText(elapsedMs) + " 만에 추천 완료</span>"
        : '<span class="elapsed">' + (page * PAGE_SIZE + 1) + "–" +
          (page * PAGE_SIZE + slice.length) + "번째 추천</span>");

    // 어떤 양념을 있다고 보고 계산했는지 되짚어 준다 (가정을 숨기지 않는다)
    var onCount = Object.keys(myPantry).filter(function (k) { return myPantry[k]; }).length;
    var assume = document.createElement("p");
    assume.className = "assume";
    assume.textContent = (onCount
      ? "집에 있다고 체크한 양념 " + onCount + "가지를 포함해서 계산했어요."
      : "양념을 하나도 체크하지 않아서, 양념까지 전부 사야 할 것으로 계산했어요.")
      // 담은 재료를 쓰는 요리가 하나도 없을 때는 그 사실을 숨기지 않는다
      + (widened ? " 담으신 재료를 쓰는 요리를 찾지 못해서, 양념만으로 만들 수 있는 요리까지 넓혀서 보여드려요." : "");

    var list = document.createElement("ul");
    list.className = "recipe-list";
    slice.forEach(function (m, i) { list.appendChild(recipeCard(m, i)); });

    var actions = document.createElement("div");
    actions.className = "actions";

    var more = document.createElement("button");
    more.type = "button"; more.className = "btn-ghost primary";
    var hasMore = ranked.length > PAGE_SIZE;
    more.textContent = hasMore ? "다른 레시피 보기" : "추천 레시피가 이게 전부예요";
    more.disabled = !hasMore;
    more.addEventListener("click", function () {
      page = (page + 1) % Math.ceil(ranked.length / PAGE_SIZE);
      renderResults();
      $results.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    var reset = document.createElement("button");
    reset.type = "button"; reset.className = "btn-ghost";
    reset.textContent = "재료 다시 입력하기";
    reset.addEventListener("click", function () {
      myIngredients = []; ranked = []; page = 0;
      render();
      $results.classList.remove("on"); $results.innerHTML = "";
      window.scrollTo({ top: 0, behavior: "smooth" });
      $input.focus();
    });

    actions.appendChild(more); actions.appendChild(reset);
    $results.appendChild(head); $results.appendChild(assume);
    $results.appendChild(list); $results.appendChild(actions);
  }

  /* 결과가 튀어나오기 전에 로딩 연출을 잠깐 보여준다. 화면 연출용 시간일 뿐,
     추천 계산과는 상관이 없다 — 아래에서 시간을 잴 때 이 값이 섞이지 않게 한다. */
  var LOADING_MS = 700;

  $search.addEventListener("click", function () {
    if (!myIngredients.length) return;
    $results.classList.remove("on"); $results.innerHTML = "";
    $tip.innerHTML = "💡 " + TIPS[Math.floor(Math.random() * TIPS.length)];
    $loading.classList.add("on");

    /* 2026-08-17: 예전에는 setTimeout 콜백 안에서 performance.now() 를 읽어서,
       화면에 뜨는 값이 항상 '0.7초'(=LOADING_MS)였다. 연출 시간을 추천 속도라고
       보여준 셈이라 KPI 숫자로 쓸 수 없었다. search() 앞뒤만 재도록 고쳤다. */
    var started = performance.now();
    search();
    var elapsedMs = performance.now() - started;

    setTimeout(function () {
      $loading.classList.remove("on");
      renderResults(elapsedMs);
      $results.scrollIntoView({ behavior: "smooth", block: "start" });
    }, LOADING_MS);
  });

  render();
})();
</script>
</body>
</html>
